# =============================================================
# AsteriskIA — Docker Compose
# Orquestra todos os serviços do stack.
# Uso: docker-compose up -d
# =============================================================



networks:
  asteriskia-net:
    driver: bridge

volumes:
  postgres_data:
  asterisk_recordings:
  asterisk_log:
  fail2ban_socket:
  prometheus_data:
  grafana_data:
  agents_pgdata:
  agents_knowledge:

services:

  # -----------------------------------------------------------
  # PostgreSQL 16 — Banco de dados principal
  # -----------------------------------------------------------
  apptelecom-postgres:
    image: postgres:16-alpine
    container_name: apptelecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts de migração executados na primeira inicialização
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - asteriskia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Asterisk 21 LTS — PBX principal
  # -----------------------------------------------------------
  apptelecom-asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: apptelecom-asterisk
    restart: unless-stopped
    depends_on:
      apptelecom-postgres:
        condition: service_healthy
    environment:
      AST_AMI_USER: ${AST_AMI_USER}
      AST_AMI_PASSWORD: ${AST_AMI_PASSWORD}
      SIP_TRUNK_HOST: ${SIP_TRUNK_HOST}
      SIP_TRUNK_USER: ${SIP_TRUNK_USER}
      SIP_TRUNK_PASSWORD: ${SIP_TRUNK_PASSWORD}
      SIP_TRUNK_FROM_DOMAIN: ${SIP_TRUNK_FROM_DOMAIN:-asteriskia.local}
      # Domínio SIP usado pelo softphone WebRTC (deve bater com window.location.hostname)
      SIP_DOMAIN: ${SIP_DOMAIN:-localhost}
    volumes:
      - ./asterisk/config:/etc/asterisk
      - asterisk_recordings:/var/spool/asterisk/monitor
      - asterisk_log:/var/log/asterisk
    ports:
      - "5060:5060/udp"       # SIP UDP
      - "5060:5060/tcp"       # SIP TCP
      - "5038:5038/tcp"       # AMI (Asterisk Manager Interface)
      - "8088:8088/tcp"       # HTTP/WS para WebRTC
      - "10000-10100:10000-10100/udp"  # RTP media
    networks:
      - asteriskia-net
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------------
  # Agente de IA — Python Audiosocket Server
  # Processa áudio das chamadas: STT → LLM → TTS via Gemini
  # -----------------------------------------------------------
  apptelecom-ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: apptelecom-ai-agent
    restart: unless-stopped
    depends_on:
      - asterisk
      - postgres
    environment:
      AUDIOSOCKET_PORT: ${AUDIOSOCKET_PORT:-9092}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_STT: ${GEMINI_MODEL_STT}
      GEMINI_MODEL_LLM: ${GEMINI_MODEL_LLM}
      GEMINI_MODEL_TTS: ${GEMINI_MODEL_TTS}
      # CRÍTICO: Deve usar a porta interna 8080 do container backend, não a porta exposta no host (8081)
      BACKEND_URL: http://apptelecom-backend:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUDIO_STORAGE_PATH: ${AUDIO_STORAGE_PATH}
      DOTENV_PATH: /opt/asteriskia/env/.env
    volumes:
      - asterisk_recordings:${AUDIO_STORAGE_PATH}
      - /opt/AsteriskIA/env:/opt/asteriskia/env:ro
    # Porta 9092 (AudioSocket) NAO exposta publicamente.
    # Asterisk acessa via rede Docker interna: ai-agent:9092
    # AudioSocket nao tem autenticacao - binding publico e risco critico.
    networks:
      - asteriskia-net

  # -----------------------------------------------------------
  # Scheduler — Python APScheduler
  # Motor de agendamento para Módulo 2 (testes de conectividade)
  # e Módulo 3 (polling Zabbix)
  # -----------------------------------------------------------
  apptelecom-scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: apptelecom-scheduler
    restart: unless-stopped
    depends_on:
      apptelecom-postgres:
        condition: service_healthy
      apptelecom-asterisk:
        condition: service_healthy
    environment:
      AST_AMI_HOST: asterisk
      AST_AMI_PORT: ${AST_AMI_PORT:-5038}
      AST_AMI_USER: ${AST_AMI_USER}
      AST_AMI_PASSWORD: ${AST_AMI_PASSWORD}
      # CRÍTICO: Deve usar a porta interna 8080 do container backend, não a porta exposta no host (8081)
      BACKEND_URL: http://apptelecom-backend:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ZABBIX_API_URL: ${ZABBIX_API_URL}
      ZABBIX_USER: ${ZABBIX_USER}
      ZABBIX_PASSWORD: ${ZABBIX_PASSWORD}
      ZABBIX_MIN_SEVERITY: ${ZABBIX_MIN_SEVERITY:-4}
      ZABBIX_POLL_INTERVAL_MINUTES: ${ZABBIX_POLL_INTERVAL_MINUTES:-5}
      DOTENV_PATH: /opt/asteriskia/env/.env
    volumes:
      - /opt/AsteriskIA/env:/opt/asteriskia/env:ro
    networks:
      - asteriskia-net

  # -----------------------------------------------------------
  # Backend — Spring Boot 3 (WAR no Tomcat 11 embutido)
  # API REST principal do sistema
  # -----------------------------------------------------------
  apptelecom-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apptelecom-backend
    restart: unless-stopped
    depends_on:
      apptelecom-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET}
      BACKEND_ALLOWED_ORIGINS: ${BACKEND_ALLOWED_ORIGINS}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_USER_EMAIL: ${JIRA_USER_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      AUDIO_STORAGE_PATH: ${AUDIO_STORAGE_PATH}
      AST_AMI_HOST: asterisk
      AST_AMI_PORT: ${AST_AMI_PORT:-5038}
      AST_AMI_USER: ${AST_AMI_USER}
      AST_AMI_PASSWORD: ${AST_AMI_PASSWORD}
      AST_CONFIG_DIR: /etc/asterisk
      ZABBIX_API_URL: ${ZABBIX_API_URL}
      ZABBIX_USER: ${ZABBIX_USER}
      ZABBIX_PASSWORD: ${ZABBIX_PASSWORD}
      ZABBIX_MIN_SEVERITY: ${ZABBIX_MIN_SEVERITY:-4}
      ZABBIX_POLL_INTERVAL_MINUTES: ${ZABBIX_POLL_INTERVAL_MINUTES:-5}
      # Settings Manager — permite ao backend reescrever .env e reiniciar containers
      SETTINGS_FILE_PATH: /opt/asteriskia/env/.env
      SETTINGS_COMPOSE_DIR: /opt/AsteriskIA
    volumes:
      - asterisk_recordings:${AUDIO_STORAGE_PATH}
      # Acesso ao .env para leitura/escrita via SettingsService
      - /opt/AsteriskIA/env:/opt/asteriskia/env
      # Acesso aos configs do Asterisk (pjsip, extensions) para edição via UI
      - /opt/AsteriskIA/asterisk/config:/etc/asterisk
      # Socket do fail2ban — permite executar fail2ban-client via backend
      - fail2ban_socket:/var/run/fail2ban
      # Configs do security — leitura/escrita dos jails e filtros pela UI
      - /opt/AsteriskIA/security/config:/opt/asteriskia/security/config
      - /opt/AsteriskIA/security:/opt/asteriskia/security
      # Docker socket — necessário para executar 'docker compose up -d' no apply
      - /var/run/docker.sock:/var/run/docker.sock
      # Diretório raiz do projeto — necessário para docker compose encontrar o compose.yml
      - /opt/AsteriskIA:/opt/AsteriskIA:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - asteriskia-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -----------------------------------------------------------
  # Frontend — React SPA servida por Nginx
  # -----------------------------------------------------------
  apptelecom-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_ASTERISK_WS: ${VITE_ASTERISK_WS:-ws://localhost:8088/ws}
        VITE_SIP_URI: ${VITE_SIP_URI:-sip:9001@localhost}
        VITE_SIP_PASSWORD: ${VITE_SIP_PASSWORD:-webrtc9001pass}
    container_name: apptelecom-frontend
    restart: unless-stopped
    depends_on:
      apptelecom-backend:
        condition: service_healthy
    # Sem mapeamento de porta no host — o Caddy acessa via rede Docker interna
    # (apptelecom-frontend:80). Expor 80:80 conflitaria com o caddy-proxy.
    networks:
      - asteriskia-net

  # -----------------------------------------------------------
  # Prometheus — Coleta de métricas
  # -----------------------------------------------------------
  apptelecom-prometheus:
    image: prom/prometheus:latest
    container_name: apptelecom-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - asteriskia-net

  # -----------------------------------------------------------
  # Security — fail2ban + iptables
  # Protege o Asterisk contra ataques SIP (brute-force, scan,
  # flood). Roda com network_mode: host para acessar o iptables
  # real do kernel. Monitora /var/log/asterisk/full via volume.
  # -----------------------------------------------------------
  apptelecom-security:
    build:
      context: ./security
      dockerfile: Dockerfile
    container_name: apptelecom-security
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      apptelecom-asterisk:
        condition: service_healthy
    environment:
      ASTERISK_LOG_FILE: /var/log/asterisk/full
    volumes:
      # Log do Asterisk — leitura pelo fail2ban
      - asterisk_log:/var/log/asterisk:ro
      # Configuração dos jails — editável pela UI
      - ./security/config/jail.d:/etc/fail2ban/jail.d
      - ./security/config/filter.d:/etc/fail2ban/filter.d
      - ./security/config/action.d:/etc/fail2ban/action.d
      # Socket do fail2ban — compartilhado com o backend para fail2ban-client
      - fail2ban_socket:/var/run/fail2ban
    healthcheck:
      test: ["CMD", "fail2ban-client", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------------
  # Grafana — Dashboards de monitoração
  # -----------------------------------------------------------
  apptelecom-grafana:
    image: grafana/grafana:latest
    container_name: apptelecom-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - asteriskia-net

  # ===========================================================
  # AsteriskIA Agentes — Plataforma de agentes autônomos
  # ===========================================================

  # -----------------------------------------------------------
  # PostgreSQL exclusivo dos agentes (banco separado do Telecom)
  # -----------------------------------------------------------
  appagents-postgres:
    image: postgres:16-alpine
    container_name: appagents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       agentsdb
      POSTGRES_USER:     agents
      POSTGRES_PASSWORD: ${AGENTS_DB_PASS:-agents_secret}
    volumes:
      - agents_pgdata:/var/lib/postgresql/data
    networks:
      - asteriskia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agentsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Backend FastAPI — API dos agentes
  # -----------------------------------------------------------
  appagents-backend:
    build:
      context: ./agents-platform/backend
      dockerfile: Dockerfile
    container_name: appagents-backend
    restart: unless-stopped
    depends_on:
      appagents-postgres:
        condition: service_healthy
    environment:
      AGENTS_DB_HOST:     agents-postgres
      AGENTS_DB_PORT:     5432
      AGENTS_DB_NAME:     agentsdb
      AGENTS_DB_USER:     agents
      AGENTS_DB_PASS:     ${AGENTS_DB_PASS:-agents_secret}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # ── LLM Configuração ──────────────────────────────────────────────────
      # Provedor ativo: google | anthropic | openai | minimax | openai_compat
      AGENTS_LLM_PROVIDER:  ${AGENTS_LLM_PROVIDER:-google}
      # Modelo do provedor ativo
      AGENTS_LLM_MODEL:     ${AGENTS_LLM_MODEL:-gemini-2.5-flash}
      # Habilita IA globalmente — false por padrão (opt-in)
      AGENTS_LLM_ENABLED:   ${AGENTS_LLM_ENABLED:-false}
      # API keys por provedor (preencha apenas o que usar)
      AGENTS_LLM_GOOGLE_KEY:    ${AGENTS_LLM_GOOGLE_KEY:-${GEMINI_API_KEY:-}}
      AGENTS_LLM_ANTHROPIC_KEY: ${AGENTS_LLM_ANTHROPIC_KEY:-}
      AGENTS_LLM_OPENAI_KEY:    ${AGENTS_LLM_OPENAI_KEY:-}
      AGENTS_LLM_MINIMAX_KEY:   ${AGENTS_LLM_MINIMAX_KEY:-}
      AGENTS_LLM_MINIMAX_GROUP_ID: ${AGENTS_LLM_MINIMAX_GROUP_ID:-}
      # URL base para APIs compatíveis com OpenAI (Ollama, Groq, Together…)
      AGENTS_LLM_COMPAT_URL:    ${AGENTS_LLM_COMPAT_URL:-http://localhost:11434/v1}
      AGENTS_LLM_COMPAT_KEY:    ${AGENTS_LLM_COMPAT_KEY:-}
      BACKEND_JWT_SECRET:       ${BACKEND_JWT_SECRET}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agents_knowledge:/app/knowledge_docs
      - /opt/AsteriskIA/env:/opt/AsteriskIA/env
    networks:
      - asteriskia-net

  # -----------------------------------------------------------
  # Frontend estático dos agentes (nginx serve o index.html)
  # -----------------------------------------------------------
  appagents-frontend:
    image: nginx:alpine
    container_name: appagents-frontend
    restart: unless-stopped
    volumes:
      - ./agents-platform/frontend:/usr/share/nginx/html:ro
      - ./agents-platform/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - asteriskia-net

