<script>'use strict';
const {useState, useEffect, useRef, createElement: h} = React;
const API = window.AGENTS_API || '/agents';

var TELECOM_API = window.TELECOM_API || '/api/v1';
var TOKEN_KEY   = 'asteriskia_token';
var USER_KEY    = 'asteriskia_user';
function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function getUser() { return localStorage.getItem(USER_KEY)||''; }
function clearAuth(){ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); }
// Extrai a claim "role" do JWT (mesmo token/segredo do backend Telecom) sem validar
// assinatura — só um hint de UI pra esconder nav/botoes admin; a autorizacao real
// continua sendo aplicada pelo agents-backend (auth.py require_admin) em cada request.
function _decodeTokenPayload(tok){
  var b64 = tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  while (b64.length % 4) b64 += '=';
  var json = decodeURIComponent(atob(b64).split('').map(function(c){
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
  return JSON.parse(json);
}
function getRole(){
  var tok = getToken();
  if (!tok) return 'USER';
  try {
    return _decodeTokenPayload(tok).role === 'ADMIN' ? 'ADMIN' : 'USER';
  } catch (e) { return 'USER'; }
}
// Claim "perm" (grupos de acesso granulares - V22): {resource_key: "r"|"w"|"rw"}.
// Tokens emitidos antes do RBAC granular nao tem essa claim - mapa vazio, e quem
// chama trata ADMIN (role legada) como acesso total via canRead/canWrite abaixo.
function getPermissions(){
  var tok = getToken();
  if (!tok) return {};
  try {
    var perm = _decodeTokenPayload(tok).perm;
    return (perm && typeof perm === 'object') ? perm : {};
  } catch (e) { return {}; }
}
// ADMIN (role legada) sempre pode - mantem uma sessao ja aberta antes do deploy
// do RBAC granular (token so com "role") enxergando a nav certa ate relogar,
// espelhando o fallback dual-emit do SecurityConfig.java/auth.py.
function canRead(role, perms, resource){
  return role === 'ADMIN' || (perms[resource] || '').indexOf('r') !== -1;
}
function canWrite(role, perms, resource){
  return role === 'ADMIN' || (perms[resource] || '').indexOf('w') !== -1;
}


// ── API ───────────────────────────────────────────────────────────────────────
function _authHeaders(extra) {
  var h = Object.assign({'Content-Type':'application/json'}, extra||{});
  var tok = getToken();
  if (tok) h['Authorization'] = 'Bearer ' + tok;
  return h;
}
function _apiFetch(p, opts) {
  // Achados de segurança/robustez: (1) o catch final engolia QUALQUER falha —
  // rede fora do ar, 403, 404, 500 — devolvendo {} sempre, sem a promise
  // nunca rejeitar; toda página mostrava "nenhum registro" mesmo com a API
  // fora do ar. (2) hadToken era lido DEPOIS do clearAuth() já ter limpado o
  // token, então a condição nunca era verdadeira e a página nunca recarregava
  // numa sessão expirada.
  return fetch(API+p, opts).then(function(r){
    var hadToken = !!getToken();
    if (r.status === 401) {
      clearAuth();
      if (hadToken) location.reload();
      return Promise.reject(new Error('Sessao expirada'));
    }
    if (!r.ok) {
      return r.json().catch(function(){ return {}; }).then(function(d){
        return Promise.reject(new Error((d && d.message) || ('Erro ' + r.status)));
      });
    }
    return r.json();
  });
}
const api = {
  get:  function(p)      { return _apiFetch(p, {headers: _authHeaders()}); },
  post: function(p,b)    { return _apiFetch(p, {method:'POST',  headers:_authHeaders(), body:JSON.stringify(b)}); },
  put:  function(p,b)    { return _apiFetch(p, {method:'PUT',   headers:_authHeaders(), body:JSON.stringify(b)}); },
  del:  function(p)      { return _apiFetch(p, {method:'DELETE',headers:_authHeaders()}); },
  upload: function(p,fd) {
    var h = {}; var tok = getToken(); if(tok) h['Authorization']='Bearer '+tok;
    return fetch(API+p, {method:'POST', headers:h, body:fd}).then(function(r){return r.json();}).catch(function(){return {};});
  }
};

  key:       '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
  book:      '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="12" y1="6" x2="16" y2="6"/><line x1="12" y1="10" x2="16" y2="10"/><line x1="12" y1="14" x2="16" y2="14"/>',
  externallink: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'
};

function Ico(props) {
  var n = props.n;
  var s = props.s || 15;
  return h('svg', {
    width: s, height: s, viewBox: '0 0 24 24',
    fill: 'none', stroke: 'currentColor', strokeWidth: '2',
    strokeLinecap: 'round', strokeLinejoin: 'round',
    style: {flexShrink: 0},
    dangerouslySetInnerHTML: {__html: ICONS[n] || ''}
  });
}

function SBadge(props) {
  var s = props.s;
  var cls = {idle:'b-gray',running:'b-run',success:'b-ok',error:'b-err',partial:'b-warn',paused:'b-gray'};
  var lbl = {idle:'Aguardando',running:'Executando',success:'Sucesso',error:'Erro',partial:'Parcial',paused:'Pausado'};
  return h('span', {className: 'badge ' + (cls[s] || 'b-gray')},
    h('span', {className: 'dot'}),
    lbl[s] || s
  );
}

function Confirm(props) {
  return h('div', {className: 'overlay', onClick: props.onCancel},
    h('div', {className: 'modal', style: {width: 360, maxHeight: 'none'}, onClick: function(e){e.stopPropagation()}},
      h('div', {className: 'mb', style: {padding: 24}},
        h('p', {style: {fontWeight: 600, marginBottom: 8}}, 'Confirmar'),
        h('p', {style: {color: 'var(--text2)', fontSize: 13}}, props.msg)
      ),
      h('div', {className: 'mf'},
        h('button', {className: 'btn btn-g', onClick: props.onCancel}, 'Cancelar'),
        h('button', {className: 'btn btn-d', onClick: props.onOk}, 'Confirmar')
      )
    )
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard() {
  var dS=useState(null);  var data=dS[0];   var setData=dS[1];
  var pS=useState([]);    var pdata=pS[0];  var setPdata=pS[1];
  var pdState=useState('day'); var period=pdState[0]; var setPeriod=pdState[1];
  var loadingS=useState(true); var loading=loadingS[0]; var setLoading=loadingS[1];

  function load(p) {
    setLoading(true);
    Promise.all([
      api.get('/api/executions/dashboard/summary'),
      api.get('/api/executions/dashboard/period?period='+(p||period))
    ]).then(function(res){
      setData(res[0]&&res[0].active_agents!==undefined ? res[0] : null);
      setPdata(Array.isArray(res[1]) ? res[1] : []);
      setLoading(false);
    }).catch(function(){ setData(null); setPdata([]); setLoading(false); });
  }

  useEffect(function(){ load(); }, []);
  function changePeriod(p){ setPeriod(p); load(p); }

// ── SECRETS PAGE ─────────────────────────────────────────────────────────────
function SecretsPage() {
  var agS=useState([]); var agents=agS[0]; var setAgents=agS[1];
  var selS=useState(''); var selAgent=selS[0]; var setSelAgent=selS[1];
  var scS=useState([]); var secrets=scS[0]; var setSecrets=scS[1];
  var ldS=useState(false); var loading=ldS[0]; var setLoading=ldS[1];
  var msgS=useState(null); var msg=msgS[0]; var setMsg=msgS[1];
  var fmS=useState({key:'',value:''}); var form=fmS[0]; var setForm=fmS[1];
  var cfS=useState(null); var conf=cfS[0]; var setConf=cfS[1];

  useEffect(function(){
    api.get('/api/agents/?limit=200').then(function(r){
      setAgents(Array.isArray(r)?r:(r&&r.items?r.items:[]));
    }).catch(function(){});
  },[]);

  function loadSecrets(aid) {
    if(!aid) return;
    setLoading(true);
    api.get('/api/system/agents/'+aid+'/secrets').then(function(r){
      setSecrets(Array.isArray(r)?r:[]); setLoading(false);
    }).catch(function(){ setSecrets([]); setLoading(false); });
  }

  function selectAgent(aid) {
    setSelAgent(aid); setSecrets([]); setForm({key:'',value:''});
    loadSecrets(aid);
  }

  function save() {
    if(!form.key||!form.value) { flash('Preencha chave e valor.'); return; }
    api.post('/api/system/agents/'+selAgent+'/secrets', {key:form.key,value:form.value})
      .then(function(r){
        if(r&&r.ok){ flash('Secret salvo.'); setForm({key:'',value:''}); loadSecrets(selAgent); }
        else flash('Erro ao salvar.');
      })
      .catch(function(e){ flash(e.message||'Erro ao salvar.'); });
  }

  function del(key) {
    api.del('/api/system/agents/'+selAgent+'/secrets/'+encodeURIComponent(key))
      .then(function(){ loadSecrets(selAgent); })
      .catch(function(e){ flash(e.message||'Erro ao remover.'); });
  }

  function flash(m) { setMsg(m); setTimeout(function(){setMsg(null);},3000); }

  var agentOpts = [h('option',{value:'',key:'_'},'Selecione um agente...')].concat(
    agents.map(function(a){ return h('option',{key:a.id,value:a.id},a.name); })
  );

  var rows = secrets.map(function(s){
    return h('tr',{key:s.id||s.key},
      h('td',null,h('code',{style:{fontSize:12,background:'var(--bg)',padding:'2px 6px',borderRadius:4}},s.key)),
      h('td',{className:'tmut tsm'},new Date(s.created_at).toLocaleString('pt-BR')),
      h('td',null,
        h('button',{className:'btn btn-sm btn-d',
          onClick:function(){setConf({msg:'Remover secret "'+s.key+'"?',fn:function(){del(s.key);}});}},
          h(Ico,{n:'trash',s:12})
        )
      )
    );
  });

  return h('div',null,
    conf && h(Confirm,{msg:conf.msg,onOk:function(){conf.fn();setConf(null);},onCancel:function(){setConf(null);}}),
    h('div',{className:'topbar'},h('span',{className:'tbtitle'},'Secrets por Agente')),
    h('div',{className:'content'},
      h('div',{className:'card',style:{marginBottom:16}},
        h('div',{className:'ch'},h('span',{className:'cht'},'Sobre Secrets')),
        h('p',{style:{fontSize:13,color:'var(--text2)',margin:0}},
          'Secrets são variáveis sensíveis armazenadas com segurança por agente. ',
          'Use a sintaxe ',h('code',{style:{fontSize:12,background:'var(--bg)',padding:'2px 5px',borderRadius:4}},'{{NOME_DA_CHAVE}}'),
          ' nos comandos e queries do agente para referenciar o valor em tempo de execução.'
        )
      ),

      h('div',{className:'card',style:{marginBottom:16}},
        h('div',{className:'ch'},h('span',{className:'cht'},'Selecionar agente')),
        h('div',{className:'fg'},
          h('select',{'aria-label':'Selecione o agente',value:selAgent,onChange:function(e){selectAgent(e.target.value);}},agentOpts)
        )
      ),

      selAgent && h('div',{className:'card',style:{marginBottom:16}},
        h('div',{className:'ch'},h('span',{className:'cht'},'Adicionar secret')),
        msg && h('div',{style:{padding:'8px 12px',background:'var(--ok)',color:'#fff',borderRadius:6,fontSize:13,marginBottom:12}},msg),
        h('div',{className:'fr',style:{gap:10,alignItems:'flex-end'}},
          h('div',{className:'fg',style:{flex:1}},
            h('label',null,'Chave'),
            h('input',{'aria-label':'Chave','value':form.key,placeholder:'DB_PASSWORD',
              onChange:function(e){setForm(function(f){return Object.assign({},f,{key:e.target.value});});}})
          ),
          h('div',{className:'fg',style:{flex:2}},
            h('label',null,'Valor'),
            h('input',{'aria-label':'Valor',type:'password',value:form.value,placeholder:'valor secreto',
              onChange:function(e){setForm(function(f){return Object.assign({},f,{value:e.target.value});});}})
          ),
          h('button',{className:'btn btn-p',style:{flexShrink:0,marginBottom:1},onClick:save},
            h(Ico,{n:'plus',s:13}),' Salvar'
          )
        )
      ),

      selAgent && h('div',{className:'card'},
        h('div',{className:'ch'},
          h('span',{className:'cht'},'Secrets cadastrados'),
          h('span',{className:'txs tmut'},secrets.length+' secret'+(secrets.length!==1?'s':''))
        ),
        loading
          ? h('div',{className:'empty'},'Carregando...')
          : secrets.length===0
          ? h('div',{className:'empty'},h('p',null,'Nenhum secret para este agente.'))
          : h('table',null,
              h('thead',null,h('tr',null,
                h('th',null,'Chave'),
                h('th',null,'Criado em'),
                h('th',null,'')
              )),
              h('tbody',null,rows)
            )
      )
    )
  );
}

// ── LOG MODAL ─────────────────────────────────────────────────────────────────
function LogModal(props) {
  var logRef  = useRef();
  var lcls    = {info:'li', success:'ls', warning:'lw', error:'le'};

  // Estado único: {execs, selExec, logs, loading}
  var stState = useState({execs:[], selExec:'', logs:[], loading:true});
  var st = stState[0]; var setSt = stState[1];

  function update(patch) { setSt(function(s){ return Object.assign({}, s, patch); }); }

  // Carrega execuções ao abrir
  useEffect(function() {
    if (!props.agentId) return;
    update({loading:true, execs:[], logs:[], selExec:''});
    api.get('/api/executions/?agent_id=' + props.agentId + '&limit=20').then(function(r) {
      var list = Array.isArray(r) ? r : (r&&r.items ? r.items : []);
      if (list.length === 0) { update({execs:[], selExec:'', logs:[], loading:false}); return; }
      var first = list[0].id;
      update({execs: list, selExec: first, loading: true});
      // Carrega logs da primeira execução imediatamente
      api.get('/api/executions/' + first + '/logs?limit=500').then(function(lr) {
        update({logs: Array.isArray(lr) ? lr : [], loading: false});
      }).catch(function(){ update({loading:false}); });
    }).catch(function(){ update({loading:false}); });
  }, []);

  function selectExec(execId) {
    update({selExec: execId, loading: true, logs: []});
    api.get('/api/executions/' + execId + '/logs?limit=500').then(function(r) {
      update({logs: Array.isArray(r) ? r : [], loading: false});
      if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
    }).catch(function(){ update({loading:false}); });
  }

  var logLines = st.loading
    ? [h('div', {key:'ld', className:'ll'}, h('span', {className:'li'}, 'Carregando...'))]
    : st.logs.length === 0
    ? [h('div', {key:'em', className:'ll'}, h('span', {className:'li'}, 'Nenhum log encontrado.'))]
    : st.logs.map(function(l, i) {
        return h('div', {key: i, className: 'll'},
          h('span', {className: 'lts'}, new Date(l.ts).toLocaleTimeString('pt-BR')),
          l.server ? h('span', {className: 'lsrv'}, '[' + l.server + ']') : null,
          h('span', {className: lcls[l.level] || 'li'}, l.message)
        );
      });

  var execOptions = st.execs.map(function(e) {
    var ts  = new Date(e.started_at).toLocaleString('pt-BR');
    var lbl = ts + ' — ' + e.status + (e.total_checks ? ' — ' + e.passed_checks + '/' + e.total_checks + ' OK' : '');
    return h('option', {key: e.id, value: e.id}, lbl);
  });

  return h('div', {className: 'overlay'},
    h('div', {className: 'modal', style: {width: 740}},
      h('div', {className: 'mh'},
        h('span', {className: 'mt'}, 'Logs de execucao'),
        h('button', {className: 'xbtn', onClick: props.onClose}, h(Ico,{n:'x',s:18}))
      ),
      h('div', {className: 'mb'},
        h('div', {className: 'fg'},
          h('label', null, 'Execucao'),
          h('select', {
            'aria-label': 'Execucao',
            value: st.selExec,
            onChange: function(e){ selectExec(e.target.value); },
            disabled: st.execs.length === 0 || st.loading
          },
            st.execs.length === 0
              ? h('option', null, 'Nenhuma execucao encontrada')
              : execOptions
          )
        ),
        st.selExec && h('div', {style:{marginBottom:8}},
          h('a', {
            href: API + '/api/reports/execution/' + st.selExec + '/html',
            target: '_blank',
            rel: 'noopener noreferrer',
            className: 'btn btn-g btn-sm'
          }, h(Ico,{n:'download',s:13}), ' Exportar HTML')
        ),
        h('div', {className: 'logview', ref: logRef}, logLines)
      )
    )
  );
}

  var def = {name:'',description:'',type:'ssh_test',skill:'',server_ids:[],
    target_urls:[],rules:{checks:[]},schedule:{type:'interval',value:'5m',active:true},
    notify_telegram:false,telegram_chat:'',
    notify_email:false,notify_email_to:'',
    notify_webhook:false,notify_webhook_url:''};

  var initial = agent ? Object.assign({}, def, agent) : def;
  var initialRules = initial.rules && initial.rules.checks ? initial.rules : {checks:[]};

  var formState     = useState(initial);

  var setForm       = formState[1];
  var chkState      = useState({name:'',cmd:'',expect:'',fix_hint:''});
  var chk           = chkState[0];
  var setChk        = chkState[1];
  var urlState      = useState('');
  var urlVal        = urlState[0];
  var setUrl        = urlState[1];

  function setF(k, v) { setForm(function(f) { var n = Object.assign({},f); n[k]=v; return n; }); }
  function setSch(k,v) { setForm(function(f) { var n = Object.assign({},f); n.schedule=Object.assign({},f.schedule); n.schedule[k]=v; return n; }); }

  function addChk() {
    if (!chk.cmd) return;
    var checks = (form.rules.checks||[]).concat([Object.assign({},chk)]);
    setF('rules', Object.assign({}, form.rules, {checks: checks}));
    setChk({name:'',cmd:'',expect:'',fix_hint:''});

    var checks = (form.rules.checks||[]).slice();

  function addUrl() {
    if (!urlVal) return;
    setF('target_urls', (form.target_urls||[]).concat([urlVal]));

    var a = (form.target_urls||[]).slice();

function Agents(props) {
  var isAdmin = !!props.isAdmin;

  var edState = useState(null);

  var logsFor = lgState[0];
  var setLogsFor = lgState[1];

  var conf    = cfState[0];
  var setConf = cfState[1];
  var ldState = useState(true); var loading=ldState[0]; var setLoading=ldState[1];
  var msgState = useState(null); var msg = msgState[0]; var setMsg = msgState[1];
  function flash(m) { setMsg(m); setTimeout(function(){setMsg(null);},4000); }

  function load() {
    setLoading(true);
    api.get('/api/agents/?limit=200').then(function(r){
      setAgents(Array.isArray(r)?r:(r&&r.items?r.items:[])); setLoading(false);
    }).catch(function(){ setAgents([]); setLoading(false); });
  }
  useEffect(function(){ load(); }, []);

  function save(data) {
    var req = editing
      ? api.put('/api/agents/'+editing.id, data).then(function(r){
          if(r&&r.id) setAgents(function(list){ return list.map(function(x){ return x.id===r.id?r:x; }); });
          else load();
        })
      : api.post('/api/agents/', data).then(function(r){
          if(r&&r.id) setAgents(function(list){ return list.concat([r]); });
          else load();
        });
    req.catch(function(e){ flash(e.message||'Erro ao salvar agente.'); });
    setShowForm(false); setEditing(null);
  }
  function del(id) {
    api.del('/api/agents/'+id)
      .then(function(){ setAgents(function(list){ return list.filter(function(x){return x.id!==id}); }); })
      .catch(function(e){ flash(e.message||'Erro ao remover agente.'); });
  }
  function toggle(a) {
    var ep = a.status==='paused' ? '/api/agents/'+a.id+'/resume' : '/api/agents/'+a.id+'/pause';
    api.post(ep,{}).then(function(){ load(); }).catch(function(e){ flash(e.message||'Erro ao alterar status.'); });
  }
  function runNow(id) {
    api.post('/api/agents/'+id+'/run',{}).then(function(){ load(); }).catch(function(e){ flash(e.message||'Erro ao executar agente.'); });
  }

  var typeLabel = {ssh_test:'SSH Test',web_monitor:'Web Monitor',log_monitor:'Log Monitor',database:'Database'};

  var rows = agents.map(function(a) {

      ? (a.schedule.type==='always' ? 'Sempre ativo' : a.schedule.type==='interval' ? 'A cada '+(a.schedule.value||'?') : a.schedule.value||'—')
      : '—';
    var nextRun = a.next_run ? new Date(a.next_run) : null;
    var diffMin = nextRun ? Math.round((nextRun - new Date()) / 60000) : null;
    var nextLabel = diffMin !== null ? (diffMin <= 0 ? 'agora' : 'em ' + diffMin + 'min') : null;

    return h('tr', {key: a.id},
      h('td', null, h('div',{className:'tbold'},a.name), a.description&&h('div',{className:'txs tmut'},a.description)),
      h('td', null, h('span',{className:'badge b-info'}, typeLabel[a.type]||a.type)),
      h('td', null, h(SBadge,{s:a.status})),
      h('td', {className:'tsm tmut'},
        a.last_run ? new Date(a.last_run).toLocaleString('pt-BR') : '—',
        nextLabel && h('div',{className:'txs',style:{color:'var(--ok)',marginTop:2}}, '↻ ' + nextLabel)
      ),
      h('td', {className:'tsm'}, schedLabel),
      h('td', null,
        h('div', {className:'flex gap2'},
          isAdmin && h('button',{className:'btn btn-sm btn-p',title:'Executar agora',onClick:function(){runNow(a.id)}}, h(Ico,{n:'play',s:12})),
          h('button',{className:'btn btn-sm btn-g',title:'Logs',onClick:function(){setLogsFor(a.id)}}, h(Ico,{n:'logs',s:12})),
          isAdmin && h('button',{className:'btn btn-sm btn-g',title:'Editar',onClick:function(){setEditing(a);setShowForm(true)}}, h(Ico,{n:'edit',s:12})),
          isAdmin && h('button',{className:'btn btn-sm '+(a.status==='paused'?'btn-s':'btn-g'),
            title:a.status==='paused'?'Retomar':'Pausar',onClick:function(){toggle(a)}},
            h(Ico,{n:a.status==='paused'?'play':'pause',s:12})
          ),
          isAdmin && h('button',{className:'btn btn-sm btn-d',title:'Excluir',
            onClick:function(){setConf({msg:'Excluir "'+a.name+'"?',fn:function(){del(a.id)}})}},
            h(Ico,{n:'trash',s:12})
          )
        )
      )
    );
  });

  return h('div', null,
    msg && h('div',{className:'alertbar'},msg),
    conf && h(Confirm, {msg:conf.msg, onOk:function(){conf.fn();setConf(null)}, onCancel:function(){setConf(null)}}),
    isAdmin && (showForm||editing) && h(AgentForm, {agent:editing,servers:servers,onSave:save,onClose:function(){setShowForm(false);setEditing(null)}}),
    logsFor && h(LogModal, {agentId:logsFor, onClose:function(){setLogsFor(null)}}),

    h('div',{className:'topbar'},
      h('span',{className:'tbtitle'},'Agentes'),
      isAdmin && h('div',{className:'flex gap2'},
        h('button',{className:'btn btn-p',onClick:function(){setEditing(null);setShowForm(true)}},h(Ico,{n:'plus',s:14}),'Novo agente')
      )
    ),
    h('div',{className:'content'},
      loading
        ? h('div',{className:'card'},h('div',{className:'empty'},'Carregando...'))
        : agents.length === 0
        ? h('div',{className:'card'},h('div',{className:'empty'},h('p',null,'Nenhum agente.')))
        : h('div',{className:'card'},
            h('table',null,
              h('thead',null,h('tr',null,
                h('th',null,'Nome'),h('th',null,'Tipo'),h('th',null,'Status'),
                h('th',null,'Ultima / Proxima'),h('th',null,'Agendamento'),h('th',null,'Acoes')
              )),
              h('tbody',null,rows)
            )
          )
    )
  );
}

var NAV = [

function App(props) {
  var pgState  = useState('dashboard');
  var page     = pgState[0];

  var srvS=useState([]); var servers=srvS[0]; var setServers=srvS[1];
  var acS=useState(0); var alertCount=acS[0]; var setAlertCount=acS[1];

  useEffect(function(){
    api.get('/api/servers/').then(function(r){
      if(Array.isArray(r)) setServers(r);
      else if(r&&r.items) setServers(r.items);
    }).catch(function(){});
  },[]);

  useEffect(function(){
    var proto=(location.protocol==='https:'?'wss:':'ws:');
    var host=location.host||'localhost';
    var ws;
    try{
      var wsToken = getToken() || '';
      ws=new WebSocket(proto+'//'+host+'/agents/ws/alerts?token='+encodeURIComponent(wsToken));
      ws.onmessage=function(e){
        try{var d=JSON.parse(e.data||'{}');if(d.level==='error'||d.level==='warning'){setAlertCount(function(n){return n+1;});}}catch(ex){}
      };

    return function(){try{if(ws)ws.close();}catch(e){}};
  },[]);

  var role = props.role, perms = props.perms || {};
  var canWriteAgents  = canWrite(role, perms, 'agents.agents');

  var pageMap = {

    llm:       function(){ return h(LLMSettings); }

  var navById = {}; NAV.forEach(function(p){ navById[p.id] = p; });
  var canOpenPage = function(id){ var p = navById[id]; return !p || !p.resource || canRead(role, perms, p.resource); };
  var activePage = (pageMap[page] && canOpenPage(page)) ? pageMap[page]() : pageMap.dashboard();

  var navItems = NAV.filter(function(p){ return !p.resource || canRead(role, perms, p.resource); }).map(function(p) {

      );

    return h('div', {key:p.id, className:'nitem '+(page===p.id?'on':''), onClick:function(){setPage(p.id)}},
      h(Ico,{n:p.icon,s:15}), p.label,
        (p.id==='reports'&&alertCount>0)?h('span',{style:{marginLeft:'auto',background:'#dc2626',color:'#fff',fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:99}},alertCount):null
    );

  return h('div',{style:{display:'flex',width:'100%',height:'100vh'}},
    h('aside',{className:'sidebar'},
      h('div',{className:'slogo'},
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}},

        ),
        props.user&&h('div',{style:{marginTop:4,fontSize:11,color:'rgba(255,255,255,.3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},props.user)
      ),

// ── LOGIN ─────────────────────────────────────────────────────────────────────
// Autentica via POST /api/v1/auth/login (backend Telecom).
// O agents-backend valida o mesmo JWT secret — token compartilhado.
function Login(props) {
  var userS  = useState('');  var user = userS[0];  var setUser = userS[1];
  var passS  = useState('');  var pass = passS[0];  var setPass = passS[1];
  var errS   = useState('');  var err  = errS[0];   var setErr  = errS[1];
  var loadS  = useState(false); var load = loadS[0]; var setLoad = loadS[1];

  function submit(e) {
    e.preventDefault();
    if (!user.trim() || !pass.trim()) { setErr('Preencha usuario e senha.'); return; }
    setLoad(true); setErr('');
    fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: user.trim(), password: pass})
    })
    .then(function(r) {
      if (!r.ok) { return r.json().then(function(d){ throw new Error(d.message || 'Credenciais invalidas'); }); }
      return r.json();
    })
    .then(function(d) {
      if (d.requiresTotp) { setErr('2FA nao suportado neste painel.'); return; }
      var tok = d.token || d.accessToken || d.access_token || '';
      if (!tok) { setErr('Resposta inesperada do servidor.'); return; }
      localStorage.setItem(TOKEN_KEY, tok);
      localStorage.setItem(USER_KEY, d.username || user.trim());
      props.onLogin(tok, d.username || user.trim());
    })
    .catch(function(e) { setErr(e.message || 'Falha ao conectar.'); })
    .finally(function() { setLoad(false); });
  }

  return h('div', {className: 'login-page'},
    h('div', {className: 'login-card'},
      h('div', {className: 'login-logo'},
        h('div', {className: 'login-logo-icon'}, 'A'),
        h('div', null,
          h('div', {className: 'login-logo-text'}, 'AsteriskIA Agentes'),
          h('div', {className: 'login-logo-sub'}, 'Plataforma de Automacao')
        )
      ),
      h('p', {className: 'login-title'}, 'Bem-vindo'),
      h('p', {className: 'login-sub'}, 'Entre com suas credenciais do AsteriskIA'),
      err ? h('div', {className: 'login-err'},
        h('span', null, '⚠'),
        h('span', null, err)
      ) : null,
      h('form', {onSubmit: submit},
        h('div', {className: 'login-field'},
          h('label', null, 'Usuario'),
          h('input', {
            'aria-label': 'Usuario',
            type: 'text', value: user, autoFocus: true,
            placeholder: 'admin',
            onChange: function(e){ setUser(e.target.value); setErr(''); }
          })
        ),
        h('div', {className: 'login-field'},
          h('label', null, 'Senha'),
          h('input', {
            'aria-label': 'Senha',
            type: 'password', value: pass,
            placeholder: '••••••••',
            onChange: function(e){ setPass(e.target.value); setErr(''); }
          })
        ),
        h('button', {className: 'btn btn-p login-btn', type: 'submit', disabled: load},
          load ? h('span', {className: 'login-spinner'}) : null,
          load ? ' Entrando...' : 'Entrar'
        )
      )
    )
  );
}

function Root() {
  var authS=useState(getToken()); var token=authS[0]; var setToken=authS[1];
  var userS=useState(getUser());  var user=userS[0];  var setUser=userS[1];
  var roleS=useState(getRole());  var role=roleS[0];  var setRole=roleS[1];
  var permS=useState(getPermissions()); var perms=permS[0]; var setPerms=permS[1];
  function onLogin(tok,usr){setToken(tok);setUser(usr);setRole(getRole());setPerms(getPermissions());}
  function onLogout(){clearAuth();setToken(null);setUser('');setRole('USER');setPerms({});}
  if(!token){return h(Login,{onLogin:onLogin});}
  return h(App,{onLogout:onLogout,user:user,role:role,perms:perms});
}

ReactDOM.createRoot(document.getElementById('root')).render(h(Root));</script>
