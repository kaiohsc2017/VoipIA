# =============================================================
# nginx-prod.conf — Configuração Nginx do HOST para produção
# (Este arquivo é para o Nginx instalado no HOST, fora do Docker)
#
# USO:
#   sudo cp nginx-prod.conf /etc/nginx/sites-available/asteriskia
#   sudo ln -s /etc/nginx/sites-available/asteriskia /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl restart nginx
#
# PRÉ-REQUISITOS:
#   - Nginx instalado no host: sudo apt install nginx
#   - Certbot: sudo certbot certonly --standalone -d SEU_DOMINIO
#   - Substituir SEU_DOMINIO em todos os campos abaixo
# =============================================================

# Redirecionar HTTP → HTTPS
server {
    listen 80;
    server_name SEU_DOMINIO;       # ex: app.suaempresa.com.br
    return 301 https://$host$request_uri;
}

# Servidor HTTPS principal
server {
    listen 443 ssl;
    server_name SEU_DOMINIO;       # ex: app.suaempresa.com.br

    # --- Certificados SSL (gerados pelo Certbot / Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;

    # Configurações de segurança SSL
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # ----------------------------------------------------------------
    # WebSocket STOMP — dashboard em tempo real
    # DEVE ficar antes do location / para ter precedência
    # ----------------------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------------
    # Backend API REST
    # ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ----------------------------------------------------------------
    # Swagger UI (documentação da API)
    # REMOVER em produção se não quiser expor a documentação externamente
    # ----------------------------------------------------------------
    location /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080/swagger-ui.html;
    }
    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080/v3/api-docs;
    }
    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080/swagger-ui/;
    }

    # ----------------------------------------------------------------
    # Actuator (health checks — restringir acesso externo em produção)
    # ----------------------------------------------------------------
    location /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        # Para restringir por IP em produção, descomentar:
        # allow SEU_IP_DE_MONITORACAO;
        # deny all;
    }

    # ----------------------------------------------------------------
    # Frontend React (SPA — container Nginx interno na porta 80)
    # ----------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
