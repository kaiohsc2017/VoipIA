; =============================================================
; http.conf — Configuração do Servidor HTTP embutido
; Necessário para o funcionamento do WebSocket (WebRTC)
; =============================================================

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; Para desenvolvimento local sem SSL, usaremos apenas HTTP/WS.
; Em produção, tlsenable=yes e tlsbindaddr=0.0.0.0:8089 devem ser configurados.
