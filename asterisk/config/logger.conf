; =============================================================
; logger.conf — Configuração de logs do Asterisk
; =============================================================

[general]
dateformat = %F %T
; Rotação é feita externamente pelo logrotate do host (size 100M, rotate 10,
; maxage 10 — ver /etc/logrotate.d/voipia-asterisk). "none" faz o Asterisk
; apenas fechar/reabrir o arquivo original no "logger rotate" (chamado pelo
; postrotate), sem tentar renomear/rotacionar por conta própria.
rotatestrategy = none

[logfiles]
; Log completo em arquivo rotacionado diariamente
/var/log/asterisk/full => notice,warning,error,debug,verbose
; Console apenas erros e avisos relevantes
console => notice,warning,error
