; =============================================================
; extensions.conf — Plano de Discagem
; Define o comportamento de cada extensão/contexto do sistema.
;
; Contextos:
;   recepcao-tronco      → Chamadas recebidas do tronco SIP
;   ramais-internos      → Ramais de teste (softphones)
;   ura-jira             → Módulo 1: URA para abertura de chamado Jira
;   discagem-sainte      → Módulo 2 e 3: Chamadas de saída do sistema
; =============================================================

; ---------------------------------------------------------------
; Contexto: recepcao-tronco
; Chamadas entrantes do tronco SIP da operadora.
; Redireciona para a URA Jira (Módulo 1).
; ---------------------------------------------------------------
[recepcao-tronco]
; DID 1000 → URA de abertura de chamado Jira
exten => 1000,1,NoOp(=== MÓDULO 1: Chamada entrada DID 1000 ===)
exten => 1000,n,Answer()
exten => 1000,n,Wait(1)
; Inicia gravação da chamada em formato WAV, 16bit mono
exten => 1000,n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}_jira.wav,b)
; Conecta ao Agente de IA via Audiosocket para conduzir a URA
exten => 1000,n,AudioSocket(ai-agent:9092,${UNIQUEID})
exten => 1000,n,Hangup()

; Qualquer outro número → encaminha diretamente
exten => _X.,1,NoOp(=== DID genérico: ${EXTEN} ===)
exten => _X.,n,Answer()
exten => _X.,n,Hangup()

; ---------------------------------------------------------------
; Contexto: ramais-internos
; Ramais registrados via softphone para testes locais.
; ---------------------------------------------------------------
[ramais-internos]
; Discar para extensão 1000 → acessa URA Jira (Módulo 1)
exten => 1000,1,NoOp(=== Ramal interno → URA Jira ===)
exten => 1000,n,Answer()
exten => 1000,n,Wait(1)
exten => 1000,n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}_jira.wav,b)
exten => 1000,n,AudioSocket(ai-agent:9092,${UNIQUEID})
exten => 1000,n,Hangup()

; Discagem entre ramais internos
exten => _10XX,1,NoOp(=== Chamada entre ramais: ${EXTEN} ===)
exten => _10XX,n,Dial(PJSIP/${EXTEN},30)
exten => _10XX,n,Hangup()

; ---------------------------------------------------------------
; Contexto: discagem-sainte
; Usado pelo scheduler (Módulo 2 - testes de conectividade)
; e pelo backend (Módulo 3 - alertas de infraestrutura).
;
; Variáveis esperadas ao originar via AMI:
;   ${ARG1} → Número a discar
;   ${UNIQUEID} → ID único da chamada (disponível automaticamente)
; ---------------------------------------------------------------
[discagem-sainte]

; --- Módulo 2: Teste de conectividade ---
; O scheduler origina com contexto=discagem-sainte, exten=teste-conectividade
exten => teste-conectividade,1,NoOp(=== MÓDULO 2: Testando conectividade → ${ARG1} ===)
exten => teste-conectividade,n,Set(DIAL_TIMEOUT=20)
exten => teste-conectividade,n,Dial(PJSIP/${ARG1}@tronco-sip,${DIAL_TIMEOUT},g)
exten => teste-conectividade,n,NoOp(Status SIP: ${DIALSTATUS} - Causa: ${HANGUPCAUSE})
; Retorna código de causa SIP ao AMI via variável de canal
exten => teste-conectividade,n,Set(CHANNEL(hangupcause)=${HANGUPCAUSE})
exten => teste-conectividade,n,Hangup()

; --- Módulo 3: Alerta de infraestrutura ---
; O backend origina com contexto=discagem-sainte, exten=alerta-infra
exten => alerta-infra,1,NoOp(=== MÓDULO 3: Alerta Zabbix → ${ARG1} ===)
exten => alerta-infra,n,Answer()
exten => alerta-infra,n,Wait(1)
; Grava a chamada de alerta
exten => alerta-infra,n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}_alerta.wav,b)
; Conecta ao Agente de IA para TTS do incidente
exten => alerta-infra,n,AudioSocket(ai-agent:9092,${UNIQUEID})
exten => alerta-infra,n,Hangup()

; Handler para chamadas não atendidas / timeout
exten => h,1,NoOp(=== Chamada encerrada: Status=${DIALSTATUS} | Causa=${HANGUPCAUSE} ===)
