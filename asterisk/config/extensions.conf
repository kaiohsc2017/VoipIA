; =============================================================
; extensions.conf — Plano de Discagem AsteriskIA
; Define o comportamento de cada contexto/extensão do sistema.
;
; Contextos:
;   recepcao-tronco     → Chamadas recebidas do tronco SIP
;   ramais-internos     → Ramais de teste (softphones)
;   asteriskia-jira     → Módulo 1: URA para abertura de chamado Jira
;   asteriskia-test     → Módulo 2: Testes de conectividade
;   asteriskia-alert    → Módulo 3: Ligações de alerta Zabbix
; =============================================================

; ---------------------------------------------------------------
; Contexto: recepcao-tronco
; Chamadas entrantes do tronco SIP da operadora.
; ---------------------------------------------------------------
[recepcao-tronco]

; DID padrão → URA de abertura de chamado Jira (Módulo 1)
exten => s,1,NoOp(=== MÓDULO 1: Chamada entrada DID ===)
exten => s,n,Answer()
exten => s,n,Wait(1)
; Grava a chamada em WAV 16bit mono
exten => s,n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}_jira.wav,b)
; Conecta ao Agente de IA via Audiosocket → JiraCallFlow
exten => s,n,AudioSocket(ai-agent:9092,${UNIQUEID})
exten => s,n,Hangup()

; Qualquer extensão numérica recebida → mesmo fluxo
exten => _X.,1,Goto(s,1)

; Handler de encerramento
exten => h,1,NoOp(=== Chamada encerrada: DIALSTATUS=${DIALSTATUS} ===)

; ---------------------------------------------------------------
; Contexto: ramais-internos
; Ramais registrados via softphone para testes locais.
; ---------------------------------------------------------------
[ramais-internos]

; Ramal 1000 → URA Jira (Módulo 1 - teste local)
exten => 1000,1,NoOp(=== Ramal interno → URA Jira ===)
exten => 1000,n,Answer()
exten => 1000,n,Wait(1)
exten => 1000,n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}_jira.wav,b)
exten => 1000,n,AudioSocket(ai-agent:9092,${UNIQUEID})
exten => 1000,n,Hangup()

; Ramal 1001 → Simula alerta Zabbix (Módulo 3 - teste local)
exten => 1001,1,NoOp(=== Ramal interno → Teste Alerta Zabbix ===)
exten => 1001,n,Answer()
exten => 1001,n,Wait(1)
exten => 1001,n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}_alerta.wav,b)
; UUID prefixado com "alert-" para que o agente detecte ZabbixAlertFlow
exten => 1001,n,AudioSocket(ai-agent:9092,alert-${UNIQUEID})
exten => 1001,n,Hangup()

; Discagem entre ramais (10XX)
exten => _10XX,1,NoOp(=== Chamada entre ramais: ${EXTEN} ===)
exten => _10XX,n,Dial(PJSIP/${EXTEN},30)
exten => _10XX,n,Hangup()

exten => h,1,NoOp(=== Encerrado: ${HANGUPCAUSE} ===)

; ---------------------------------------------------------------
; Contexto: ramais-webrtc
; Ramais WebRTC dos usuários do sistema (9001, 9002, ...).
; Permite discagem entre softphones e acesso aos módulos de teste.
; ---------------------------------------------------------------
[ramais-webrtc]

; Ramal 1000 → URA Jira (Módulo 1 - teste via softphone)
exten => 1000,1,NoOp(=== WebRTC → URA Jira ===)
exten => 1000,n,Answer()
exten => 1000,n,Wait(1)
exten => 1000,n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}_jira.wav,b)
exten => 1000,n,AudioSocket(ai-agent:9092,${UNIQUEID})
exten => 1000,n,Hangup()

; Ramal 1001 → Simula alerta Zabbix (Módulo 3 - teste via softphone)
exten => 1001,1,NoOp(=== WebRTC → Teste Alerta Zabbix ===)
exten => 1001,n,Answer()
exten => 1001,n,Wait(1)
exten => 1001,n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}_alerta.wav,b)
exten => 1001,n,AudioSocket(ai-agent:9092,alert-${UNIQUEID})
exten => 1001,n,Hangup()

; Discagem entre softphones WebRTC (90XX → 90XX)
exten => _90XX,1,NoOp(=== Chamada WebRTC entre ramais: ${EXTEN} ===)
exten => _90XX,n,Dial(PJSIP/${EXTEN},30)
exten => _90XX,n,Hangup()

; Discagem para ramais internos (10XX)
exten => _10XX,1,NoOp(=== WebRTC → Ramal interno: ${EXTEN} ===)
exten => _10XX,n,Dial(PJSIP/${EXTEN},30)
exten => _10XX,n,Hangup()

exten => h,1,NoOp(=== WebRTC encerrado: ${HANGUPCAUSE} ===)


; ---------------------------------------------------------------
; Contexto: asteriskia-jira (=== MÓDULO 1 ===)
; Originado pelo JiraCallFlow para chamadas de saída URA.
; (Reservado para uso futuro — chamadas URA de retorno)
; ---------------------------------------------------------------
[asteriskia-jira]
exten => s,1,NoOp(=== Módulo 1: Chamada URA de retorno ===)
exten => s,n,Answer()
exten => s,n,Wait(1)
exten => s,n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}_jira.wav,b)
exten => s,n,AudioSocket(ai-agent:9092,${UNIQUEID})
exten => s,n,Hangup()
exten => h,1,NoOp(=== Encerrado: ${HANGUPCAUSE} ===)

; ---------------------------------------------------------------
; Contexto: asteriskia-test (=== MÓDULO 2 ===)
; Originado pelo Scheduler Python para testes de conectividade.
;
; AMI Originate enviado pelo AmiService:
;   Channel: PJSIP/<phone>@trunk-saida
;   Context: asteriskia-test
;   Exten: s
;   Variable: TEST_RESULT_ID=...,FLOW_TYPE=CONNECTIVITY_TEST
; ---------------------------------------------------------------
[asteriskia-test]
exten => s,1,NoOp(=== MÓDULO 2: Teste de Conectividade → ${CHANNEL} ===)
exten => s,n,Set(DIAL_TIMEOUT=20)
; Toca mas não atende — apenas verifica se o número está ativo
exten => s,n,Dial(${CHANNEL},${DIAL_TIMEOUT})
exten => s,n,NoOp(DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
exten => s,n,Hangup()

; Handler de encerramento — captura causa SIP para o AMI
exten => h,1,NoOp(=== Teste encerrado: STATUS=${DIALSTATUS} CAUSE=${HANGUPCAUSE} ===)
exten => h,n,Set(CHANNEL(hangupcause)=${HANGUPCAUSE})

; ---------------------------------------------------------------
; Contexto: asteriskia-alert (=== MÓDULO 3 ===)
; Originado pelo AmiOriginateService (backend Java) para alertas Zabbix.
;
; AMI Originate enviado pelo AmiOriginateService.originateAlertCall():
;   Channel: PJSIP/<phone>@trunk-saida
;   Context: asteriskia-alert
;   Exten: s
;   Variable: CALL_UUID=alert-<uuid>,ZABBIX_SEVERITY=...,FLOW_TYPE=ZABBIX_ALERT
; ---------------------------------------------------------------
[asteriskia-alert]
exten => s,1,NoOp(=== MÓDULO 3: Alerta Zabbix → ${ZABBIX_SEVERITY} em ${ZABBIX_HOST} ===)
exten => s,n,Answer()
exten => s,n,Wait(1)
; Grava a chamada de alerta para auditoria
exten => s,n,MixMonitor(/var/spool/asterisk/monitor/${CALL_UUID}_alerta.wav,b)
; UUID passado como variável de canal (com prefixo "alert-")
; O Agente de IA detecta "alert-" e usa o ZabbixAlertFlow
exten => s,n,AudioSocket(ai-agent:9092,${CALL_UUID})
exten => s,n,Hangup()

exten => h,1,NoOp(=== Alerta encerrado: ${HANGUPCAUSE} ===)
