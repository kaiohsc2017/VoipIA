; =============================================================
; modules.conf — AsteriskIA (limpo para andrius/asterisk:20-cert)
; =============================================================

[modules]
autoload=yes

; Desabilitar módulos que não existem na imagem
noload => app_hangup.so
noload => app_answer.so
noload => app_wait.so
noload => app_waitdigit.so
noload => app_noop.so
noload => codec_opus.so
noload => res_ari.so
; res_stun_monitor habilitado — necessário para ICE/WebRTC atrás de NAT
load => res_stun_monitor.so
noload => res_odbc.so
noload => chan_iax2.so
noload => app_confbridge.so
noload => app_queue.so
noload => app_followme.so
noload => app_agent_pool.so
noload => res_parking.so
noload => res_pjsip_notify.so
noload => cdr_manager.so
noload => cel_manager.so
noload => app_page.so

; Módulos principais que queremos garantir
load => res_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_outbound_registration.so
load => chan_pjsip.so
load => app_audiosocket.so
load => app_playback.so
load => app_record.so
load => app_mixmonitor.so
load => manager.so
load => res_musiconhold.so
load => res_http_websocket.so