; =============================================================
; rtp.conf — Configuração de RTP e ICE/STUN para WebRTC
; =============================================================
[general]
; Faixa de portas RTP — deve bater exatamente com o mapeamento do docker-compose
; (10000-10100:10000-10100/udp)
rtpstart = 10000
rtpend   = 10100

; CRÍTICO para WebRTC: durante ICE o browser troca de endereço IP.
; strictrtp=yes (padrão) rejeita RTP de IPs inesperados → sem áudio
; strictrtp=no aceita RTP de qualquer IP após o handshake → ICE funciona
strictrtp = no

; Ativa ICE — necessário para WebRTC funcionar atrás de NAT/Docker
icesupport = yes

; STUN — Asterisk usa para descobrir seu IP público nos candidatos ICE
; O browser também usa STUN (configurado no JsSIP/softphone)
stunaddr = stun.l.google.com:19302
