; =============================================================
; rtp.conf — Configuração de RTP e ICE/STUN para WebRTC
; =============================================================
[general]
; Porta RTP já mapeada no docker-compose (10000-10100/udp)
rtpstart = 10000
rtpend   = 10100

; STUN — usado pelo Asterisk para descobrir IP público nos candidatos ICE
; O browser também usa STUN (configurado no JsSIP) para o mesmo fim.
; Usamos o STUN do Google (gratuito, sem autenticação, alta disponibilidade).
stunaddr = stun.l.google.com:19302

; ICE — habilita suporte a candidatos ICE para WebRTC
icesupport = yes
