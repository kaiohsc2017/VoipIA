; =============================================================
; rtp.conf — Configuração de RTP e ICE/STUN para WebRTC
; =============================================================
[general]
rtpstart = 16000
rtpend   = 16500

; CRÍTICO para WebRTC: aceita RTP de qualquer IP após handshake ICE
strictrtp = no

; ICE — necessário para WebRTC
icesupport = yes

; STUN — descobre IP público para candidatos ICE
stunaddr = stun.l.google.com:19302

; Timeout ICE reduzido — não espera todos os candidatos
; Default é 5000ms, reduzindo para 2500ms
; (os candidatos host chegam primeiro e geralmente bastam)
iceblacklist = 0.0.0.0/8
