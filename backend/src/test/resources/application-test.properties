# Configurações para testes unitários/integração usando H2 (banco em memória)
spring.datasource.url=jdbc:h2:mem:asteriskiadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate (cria o schema automaticamente no H2)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Migrations Flyway (db/migration/) usam sintaxe exclusiva do PostgreSQL de produção
# (jsonb, gen_random_uuid, CREATE EXTENSION) e não rodam no H2 dos testes — o schema
# de teste é gerado pelo Hibernate (ddl-auto=create-drop) a partir das entidades JPA.
spring.flyway.enabled=false

# Desabilita logs de debug desnecessários nos testes
logging.level.org.springframework=WARN
logging.level.com.asteriskia=INFO

# Variáveis falsas de ambiente necessárias para o contexto carregar
app.jira.base-url=http://mock-jira
app.jira.user-email=test@mock.com
app.jira.api-token=mock-token
app.jira.project-key=MOCK
app.internal-api-key=test-internal-key-1234
app.auth.admin-username=admin
app.auth.admin-password=mock-admin-password
app.asterisk.ami.user=mock-ami-user
app.asterisk.ami.password=mock-ami-password
app.jwt.secret=mocksecretmocksecretmocksecretmocksecretmocksecretmocksecret
app.telegram.bot-token=mock:token
app.telegram.chat-id=12345
zabbix.api.url=http://mock-zabbix/api_jsonrpc.php
zabbix.api.user=Admin
zabbix.api.password=zabbix
zabbix.polling.enabled=false

# Diretório isolado para os testes de SecurityController (manual-bans.csv/whitelist.txt) —
# nunca aponta para o diretório real de produção /opt/asteriskia/security.
app.security.security-dir=${java.io.tmpdir}/asteriskia-test-security
