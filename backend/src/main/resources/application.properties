## ============================================================
## application.properties — VoipIA Backend
## Configurações do Spring Boot (valores via variáveis de ambiente)
## ============================================================

spring.application.name=voipia-backend

# --- DataSource PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/asteriskia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:asteriskia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=none: schema gerenciado pelo Flyway

# --- Flyway — migrations automáticas no startup ---
# Aplica apenas migrations pendentes (idempotente — seguro em restarts e redeploys)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false
# Nunca usar create/update em produção — evita perda de dados e conflitos.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null


# --- Servidor (porta padrão) ---
server.port=8080
server.servlet.context-path=/

# --- Multipart (upload de áudio) ---
# max-file-size = limite por arquivo (também validado em InsightsUploadService);
# max-request-size = lote inteiro, até 100 arquivos de 50MB (Fase 3 do Quality
# Management, V40 — portal de upload do supervisor).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=5GB

# --- Actuator (health check apenas — Prometheus foi removido do stack) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# spring-boot-starter-data-ldap (módulo Call Center, Fase 1) autoconfigura um LdapHealthIndicator
# que tenta abrir uma conexão em localhost:389 por padrão — nada a ver com o AD real, que é
# configurado em runtime via ConfigService/LdapTemplateFactory (AdLdapConfig), não por
# spring.ldap.*. Sem desabilitar, o healthcheck do container cai para DOWN mesmo com o AD
# desabilitado ou nunca configurado.
management.health.ldap.enabled=false

# --- OpenAPI / Swagger ---
# Removido: a dependência springdoc foi retirada do pom.xml.
# A API não é exposta publicamente via Swagger em produção.

# --- Logging ---
logging.level.com.asteriskia=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# --- Configurações da aplicação ---

## Jira Cloud
app.jira.base-url=${JIRA_BASE_URL}
app.jira.user-email=${JIRA_USER_EMAIL}
app.jira.api-token=${JIRA_API_TOKEN}
app.jira.project-key=${JIRA_PROJECT_KEY}
app.jira.sync-poll-interval-minutes=${JIRA_SYNC_POLL_INTERVAL_MINUTES:15}

## Telegram
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN}
app.telegram.chat-id=${TELEGRAM_CHAT_ID}

## IA — busca automática de preço de tokens (ai_model_pricing, AiModelPricingSyncScheduler)
## Roda todo dia às 02:00 por padrão — mudar só se souber o que está fazendo (formato cron do Spring).
app.ai.pricing-sync-cron=${AI_PRICING_SYNC_CRON:0 0 2 * * ?}

## Zabbix
app.zabbix.api-url=${ZABBIX_API_URL}
app.zabbix.user=${ZABBIX_USER}
app.zabbix.password=${ZABBIX_PASSWORD}
app.zabbix.min-severity=${ZABBIX_MIN_SEVERITY:4}
app.zabbix.poll-interval-minutes=${ZABBIX_POLL_INTERVAL_MINUTES:5}

## AMI Asterisk
app.asterisk.ami.host=${AST_AMI_HOST:asterisk}
app.asterisk.ami.port=${AST_AMI_PORT:5038}
app.asterisk.ami.user=${AST_AMI_USER}
app.asterisk.ami.password=${AST_AMI_PASSWORD}
app.asterisk.config-dir=${AST_CONFIG_DIR:/etc/asterisk}

## Security — fail2ban
app.security.fail2ban-socket=${FAIL2BAN_SOCKET:/var/run/fail2ban/fail2ban.sock}
app.security.jail-config-dir=${JAIL_CONFIG_DIR:/opt/asteriskia/security/config/jail.d}
app.security.filter-config-dir=${FILTER_CONFIG_DIR:/opt/asteriskia/security/config/filter.d}
app.security.security-dir=${SECURITY_DIR:/opt/asteriskia/security}

## Armazenamento de áudio
app.audio.storage-path=${AUDIO_STORAGE_PATH:/var/spool/asterisk/monitor}

## Insights — gravações do call center corporativo Verint (módulo apartado do Asterisk)
app.insights.audio-path=${INSIGHTS_AUDIO_PATH:/opt/audio}
## Upload de "análise sob demanda" (Quality Management, V40) — Fase 20 do plano Call Center Parte
## III: /opt/audio_upload → /opt/VoipIA/media/sobdemanda (padronização de mídia sob o repo).
app.insights.upload-audio-path=${INSIGHTS_UPLOAD_AUDIO_PATH:/opt/VoipIA/media/sobdemanda}

## Call Center (voz) — gravação/retenção/alerta de disco (Fase 3). Fase 20: /opt/gravacoes/audio
## → /opt/VoipIA/media/gravacao.
app.callcenter.recording-path=${CALLCENTER_RECORDING_PATH:/opt/VoipIA/media/gravacao}
## Biblioteca de áudios do Flow Builder (Fase 5c) — upload sempre transcodificado para
## PCM 8kHz/16-bit mono; o Asterisk lê o mesmo caminho via mount ro (docker-compose.yml).
app.callcenter.audio-library-path=${CALLCENTER_AUDIO_LIBRARY_PATH:/opt/VoipIA/media/anuncios}
## Roda todo dia às 03:30 por padrão — depois do horário de menor movimento.
app.callcenter.retention-purge-cron=${CALLCENTER_RETENTION_PURGE_CRON:0 30 3 * * ?}
app.callcenter.disk-alert-cron=${CALLCENTER_DISK_ALERT_CRON:0 0 7 * * ?}
## Estados do agente/interações (Fase 4) — listener AMI event-driven; desabilitável se AMI
## indisponível ou em ambiente sem Asterisk (ex: alguns testes manuais de infra).
app.callcenter.ami-listener.enabled=${CALLCENTER_AMI_LISTENER_ENABLED:true}
## Supervisão em tempo real (Fase 6) — checa SLA das filas a cada 10min, das 8h às 20h.
app.callcenter.sla-alert-cron=${CALLCENTER_SLA_ALERT_CRON:0 */10 8-20 * * ?}
## Fase 24: a fila do canal de chat interno passou a ser configuração de banco
## (CcChatChannel.defaultQueue) — a antiga app.callcenter.chat.public-queue-id foi removida.
## Origens permitidas no CORS do widget de chat interno (D8 — a aplicação nunca vai à internet
## aberta, roda dentro da rede corporativa; lista vazia = nenhuma origem cross-origin liberada
## até ser configurada de verdade, mesma filosofia fail-closed da variável que ela substitui).
app.callcenter.chat.allowed-origins=${CALLCENTER_CHAT_ALLOWED_ORIGINS:}
## Transcript da sessão de chat ao ser encerrada (Fase 11 do plano omnicanal) — arquivo em disco,
## mesma disciplina de retenção/auditoria da gravação de voz. Export assíncrono e tolerante a
## falha: nunca impede o encerramento da sessão. Fase 20: /opt/gravacoes/chat →
## /opt/VoipIA/media/chat.
app.callcenter.chat-transcript-path=${CALLCENTER_CHAT_TRANSCRIPT_PATH:/opt/VoipIA/media/chat}

## Base de conhecimento / RAG do chat (Fase 25) — servidor HTTP interno de embeddings dentro do
## próprio container `insights` (sem serviço novo), rede interna docker apenas.
app.callcenter.kb.embedding-url=${CALLCENTER_KB_EMBEDDING_URL:http://insights:8000}
## Modelo usado para a resposta final restrita aos trechos recuperados (nó consultar_base).
app.callcenter.kb.answer-model=${CALLCENTER_KB_ANSWER_MODEL:gemini-2.5-flash}
## Quantos trechos mais próximos recuperar por pergunta.
app.callcenter.kb.top-k=${CALLCENTER_KB_TOP_K:4}
## Limiar mínimo de similaridade de cosseno (0-1) para considerar um trecho relevante — abaixo
## disso, escala para fila humana em vez de arriscar uma resposta sem base real.
app.callcenter.kb.match-threshold=${CALLCENTER_KB_MATCH_THRESHOLD:0.55}
## Reindexação de artigos com version divergente de indexed_version — a cada 5min (edição de
## artigo é ação de admin, não precisa de latência menor que isso).
app.callcenter.kb.reindex-articles-cron=${CALLCENTER_KB_REINDEX_ARTICLES_CRON:0 */5 * * * ?}
## Busca/indexação de fontes externas por URL — 1x/dia, nunca ao vivo no hot-path do chat.
app.callcenter.kb.fetch-sources-cron=${CALLCENTER_KB_FETCH_SOURCES_CRON:0 0 4 * * ?}

## Flow Builder — motor de execução real via ARI/Stasis (Fase 5b). Extensões 6000-6999.
app.asterisk.ari.base-url=${AST_ARI_URL:http://asterisk:8088/ari}
app.asterisk.ari.user=${AST_ARI_USER:}
app.asterisk.ari.password=${AST_ARI_PASSWORD:}
app.asterisk.ari.app=${AST_ARI_APP:callcenter}
## Listener de eventos ARI event-driven — desabilitável se ARI indisponível/Asterisk fora do ar.
app.callcenter.ari.enabled=${CALLCENTER_ARI_ENABLED:true}

## CORS (origens permitidas para o frontend)
app.cors.allowed-origins=${BACKEND_ALLOWED_ORIGINS:http://localhost:3000}

## JWT
app.jwt.secret=${BACKEND_JWT_SECRET}
app.jwt.expiration-hours=8

## Credenciais Admin (simples — para produção substituir por tabela de usuários)
app.auth.admin-username=${ADMIN_USERNAME:admin}
app.auth.admin-password=${ADMIN_PASSWORD}

## Chave compartilhada para autenticação interna (AI Agent e Scheduler)
app.internal-api-key=${INTERNAL_API_KEY}

## Settings — caminho do .env (montado via volume)
app.settings.file-path=${SETTINGS_FILE_PATH:/opt/asteriskia/env/.env}

## Docker Helper — único container com acesso ao docker.sock (F-CRIT-10).
## O backend não roda mais 'docker compose'/'docker logs'/'docker exec' via
## ProcessBuilder — chama esta API HTTP interna em vez de montar o socket.
app.docker-helper.url=${DOCKER_HELPER_URL:http://docker-helper:8090}

# Scheduler de testes de conectividade (Módulo 2)
app.scheduler.poll-interval-ms=${SCHEDULER_POLL_INTERVAL_MS:60000}
