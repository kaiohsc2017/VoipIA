## ============================================================
## application.properties — AsteriskIA Backend
## Configurações do Spring Boot (valores via variáveis de ambiente)
## ============================================================

spring.application.name=asteriskia-backend

# --- DataSource PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/asteriskia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:asteriskia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ddl-auto=none: schema gerenciado pelas migrations SQL em /database/migrations/
# Nunca usar create/update em produção — evita perda de dados e conflitos.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Jackson --- 
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null


# --- Servidor (porta padrão) ---
server.port=8080
server.servlet.context-path=/

# --- Multipart (upload de áudio) ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Actuator (monitoração Prometheus) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Logging ---
logging.level.com.asteriskia=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# --- Configurações da aplicação ---

## Jira Cloud
app.jira.base-url=${JIRA_BASE_URL}
app.jira.user-email=${JIRA_USER_EMAIL}
app.jira.api-token=${JIRA_API_TOKEN}
app.jira.project-key=${JIRA_PROJECT_KEY}

## Telegram
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN}
app.telegram.chat-id=${TELEGRAM_CHAT_ID}

## Zabbix
app.zabbix.api-url=${ZABBIX_API_URL}
app.zabbix.user=${ZABBIX_USER}
app.zabbix.password=${ZABBIX_PASSWORD}
app.zabbix.min-severity=${ZABBIX_MIN_SEVERITY:4}
app.zabbix.poll-interval-minutes=${ZABBIX_POLL_INTERVAL_MINUTES:5}

## AMI Asterisk
app.asterisk.ami.host=${AST_AMI_HOST:asterisk}
app.asterisk.ami.port=${AST_AMI_PORT:5038}
app.asterisk.ami.user=${AST_AMI_USER}
app.asterisk.ami.password=${AST_AMI_PASSWORD}

## Armazenamento de áudio
app.audio.storage-path=${AUDIO_STORAGE_PATH:/var/asteriskia/recordings}

## CORS (origens permitidas para o frontend)
app.cors.allowed-origins=${BACKEND_ALLOWED_ORIGINS:http://localhost:3000}

## JWT
app.jwt.secret=${BACKEND_JWT_SECRET:changeme_dev_secret}
app.jwt.expiration-hours=8

## Credenciais Admin (simples — para produção substituir por tabela de usuários)
app.auth.admin-username=${ADMIN_USERNAME:admin}
app.auth.admin-password=${ADMIN_PASSWORD:admin123}

## Chave compartilhada para autenticação interna (AI Agent e Scheduler)
app.internal-api-key=${INTERNAL_API_KEY:internal_changeme_dev}

## Settings — caminho do .env e diretório do docker-compose no host (montados via volume)
app.settings.file-path=${SETTINGS_FILE_PATH:/opt/asteriskia/env/.env}
app.settings.compose-dir=${SETTINGS_COMPOSE_DIR:/opt/AsteriskIA}
