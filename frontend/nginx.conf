server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache assets estáticos (hashed filenames do Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------------------------------
    # WebSocket Asterisk (WebRTC Softphone)
    # Proxy para o servidor HTTP/WS interno do Asterisk na porta 8088.
    # O Softphone conecta via wss://app.voiphash.com.br/asterisk-ws
    # ----------------------------------------------------------------
    location /asterisk-ws {
        proxy_pass http://asterisk:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------------
    # WebSocket STOMP — atualizações em tempo real do Dashboard
    # OBRIGATÓRIO: sem este bloco o WebSocket falha atrás de Nginx.
    # Envia os headers Upgrade/Connection para o backend Spring Boot.
    # ----------------------------------------------------------------
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # Mantém conexão WS aberta por 1h
        proxy_send_timeout 3600s;
    }

    # Proxy reverso para o backend (evita CORS em produção)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range requests para player de áudio no browser
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
        proxy_buffering off;
    }

    # SPA fallback — redireciona tudo para index.html
    # ── Agentes — arquivos estáticos ────────────────────────────────────────
    location /agents/ {
        alias /usr/share/nginx/html/agents/;
        try_files $uri $uri/ /agents/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /agents/api/ {
        proxy_pass http://agents-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /agents/ws/ {
        proxy_pass http://agents-backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
