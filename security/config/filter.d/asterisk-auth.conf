# /etc/fail2ban/filter.d/asterisk-auth.conf
# Detecta falhas de autenticação PJSIP no log do Asterisk
# Formato do log: [Jun 13 18:11:02] WARNING[1234] ...

[INCLUDES]
before = common.conf

[Definition]
_daemon = asterisk

# Padrões detectados:
#   "No matching endpoint found" — ramal não existe
#   "Failed to authenticate" — senha errada
#   "Unable to create INVITE dialog" — tentativa inválida
failregex = ^.*Request '\S+' from .* failed for '<HOST>:\d+'.*No matching endpoint found.*$
            ^.*Request '\S+' from .* failed for '<HOST>:\d+'.*Failed to authenticate.*$
            ^.*SecurityEvent="FailedACL".*RemoteAddress=.*\b<HOST>\b.*$
            ^.*SecurityEvent="InvalidAccountID".*RemoteAddress=.*\b<HOST>\b.*$
            ^.*SecurityEvent="ChallengeResponseFailed".*RemoteAddress=.*\b<HOST>\b.*$
            ^.*SecurityEvent="InvalidPassword".*RemoteAddress=.*\b<HOST>\b.*$

ignoreregex =
