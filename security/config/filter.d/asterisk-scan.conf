# /etc/fail2ban/filter.d/asterisk-scan.conf
# Detecta varredura de extensões/ramais (enumeration attack)

[INCLUDES]
before = common.conf

[Definition]
_daemon = asterisk

# Padrões: tentativas em ramais que não existem
failregex = ^.*\[<HOST>\].*No matching endpoint found.*$
            ^.*SecurityEvent="InvalidAccountID".*RemoteAddress=.*\b<HOST>\b.*$
            ^.*No such file or directory.*<HOST>.*$
            ^.*Request 'REGISTER' from.*<HOST>.*failed for.*$

ignoreregex =
