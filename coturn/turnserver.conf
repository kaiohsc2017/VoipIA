# ============================================================
# turnserver.conf — Coturn TURN server para WebRTC relay
# A linha "user=asteriskia:<credencial>" é injetada em runtime
# pelo entrypoint do docker-compose.yml a partir da variável de
# ambiente TURN_CREDENTIAL — nunca commitar a credencial aqui.
# ============================================================

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# IP público do VPS — essencial para relay funcionar
external-ip=129.121.51.29

realm=app.voiphash.com.br
server-name=app.voiphash.com.br

# Certificados TLS para TURNS (porta 5349) — do Let's Encrypt via Caddy
cert=/etc/coturn/tls/app.voiphash.com.br.crt
pkey=/etc/coturn/tls/app.voiphash.com.br.key

# Mecanismo de credencial de longo prazo
lt-cred-mech

# Segurança
fingerprint
no-multicast-peers
no-cli

# Portas de relay UDP para sessões RTP
min-port=49152
max-port=49652

# Log para stdout (capturado pelo Docker)
log-file=stdout
