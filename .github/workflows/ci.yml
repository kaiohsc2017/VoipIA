name: CI — VoipIA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Frontend — TypeScript check + production build
  # ============================================================
  frontend:
    name: Frontend (Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b --noEmit

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 2: Backend — Maven compile + unit tests
  # ============================================================
  backend:
    name: Backend (Spring Boot + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: mvn clean compile -q

      - name: Run unit tests
        run: mvn test -q
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Package WAR (skip tests — already ran)
        run: mvn package -DskipTests -q

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-war
          path: backend/target/voipia-backend.war
          retention-days: 7

  # ============================================================
  # Job 3: Python — Syntax check (ai-agent)
  # ============================================================
  python:
    name: Python (AI Agent)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Agent dependencies
        run: pip install -r ai-agent/requirements.txt

      - name: Syntax check — AI Agent
        run: |
          find ai-agent/src -name "*.py" | while read f; do
            python3 -c "import ast; ast.parse(open('$f').read()); print('OK: $f')"
          done

  # ============================================================
  # Job 4: Docker — Build all images (sem push)
  # ============================================================
  docker-build:
    name: Docker Build (all services)
    runs-on: ubuntu-latest
    needs: [ frontend, backend, python ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: asteriskia/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ai-agent image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-agent
          push: false
          tags: asteriskia/ai-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: asteriskia/frontend:ci
          build-args: |
            VITE_API_URL=https://app.voiphash.com.br/api/v1
            VITE_ASTERISK_WS=wss://app.voiphash.com.br/asterisk-ws
            VITE_SIP_URI=sip:9001@app.voiphash.com.br
            VITE_SIP_PASSWORD=webrtc9001pass
            VITE_STUN_URL=stun:stun.l.google.com:19302
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build asterisk image
        uses: docker/build-push-action@v5
        with:
          context: ./asterisk
          push: false
          tags: asteriskia/asterisk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
