# =============================================================
# prometheus.yml — AsteriskIA
# Coleta de métricas via Spring Boot Actuator.
#
# NOTA PARA DESENVOLVEDORES:
# Os targets abaixo foram comentados pois os containers
# correspondentes (postgres-exporter, cadvisor, node-exporter,
# asterisk-exporter) ainda não estão declarados no docker-compose.yml.
# Para ativá-los, adicione primeiro os containers ao docker-compose.yml
# e depois descomente as seções abaixo.
# =============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # --- Spring Boot Actuator (backend Java) ---
  # Endpoint: /actuator/prometheus (habilitado via micrometer-registry-prometheus)
  - job_name: 'asteriskia-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  # --- Asterisk Metrics (requer asterisk_exporter no container Asterisk) ---
  # Para ativar: adicionar o exporter ao Dockerfile do Asterisk e ao docker-compose.yml
  # - job_name: 'asterisk'
  #   static_configs:
  #     - targets: ['asterisk:9105']

  # --- PostgreSQL (requer container postgres-exporter no docker-compose.yml) ---
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # --- cAdvisor (métricas dos containers Docker) ---
  # Para ativar: adicionar container cadvisor ao docker-compose.yml
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']

  # --- Node Exporter (métricas do host) ---
  # Para ativar: adicionar container node-exporter ao docker-compose.yml
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
