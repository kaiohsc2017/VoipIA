# =============================================================
# prometheus.yml — Configuração de coleta de métricas
# Scrape targets: backend, Asterisk e infraestrutura Docker
# =============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # --- Spring Boot Actuator (backend Java) ---
  - job_name: 'asteriskia-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  # --- Asterisk Metrics ---
  # Requer o asterisk_exporter (adicionado ao container Asterisk)
  - job_name: 'asterisk'
    static_configs:
      - targets: ['asterisk:9105']

  # --- PostgreSQL ---
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # --- cAdvisor (métricas dos containers Docker) ---
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # --- Node Exporter (métricas do host) ---
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
